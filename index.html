<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unlimited Page Corps</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-storage-compat.js"></script>
    <!-- Ad SDK -->
    <script src='//libtl.com/sdk.js' data-zone='10555663' data-sdk='show_10555663'></script>

    <style>
        .shiny-diamond { background: linear-gradient(135deg, #e0f2fe 0%, #7dd3fc 50%, #e0f2fe 100%); animation: shine 2s infinite; border: 2px solid #bae6fd; }
        .shiny-platinum { background: linear-gradient(135deg, #f3f4f6 0%, #d1d5db 50%, #f3f4f6 100%); animation: shine 3s infinite; border: 2px solid #9ca3af; }
        @keyframes shine { 0% { opacity: 0.9; } 50% { opacity: 1; filter: brightness(1.2); } 100% { opacity: 0.9; } }
        .page-transition { transition: all 0.3s ease-in-out; }
        #ad-overlay { display: none; }
    </style>
</head>
<body class="bg-gray-900 text-white font-sans">

    <!-- Ad Cooldown Overlay -->
    <div id="ad-status" class="fixed top-0 left-0 z-50 bg-red-600 text-[10px] px-2 py-1">Ad Cooldown Active</div>

    <nav class="bg-gray-800 p-4 border-b border-gray-700 flex justify-between items-center sticky top-0 z-40">
        <h1 class="text-xl font-bold text-blue-400">Unlimited Page Corps</h1>
        <div id="user-profile-nav" class="flex items-center gap-3 cursor-pointer">
            <span id="nav-username" class="hidden md:block">Loading...</span>
            <img id="nav-pfp" src="https://via.placeholder.com/40" class="w-10 h-10 rounded-full border-2 border-blue-500">
        </div>
    </nav>

    <!-- Paperhouse Inc Section -->
    <section class="bg-blue-900 py-2 text-center text-xs font-bold uppercase tracking-widest">
        Paperhouse Inc.
    </section>

    <main class="container mx-auto p-4 mb-20">
        
        <!-- View: Feed (Home) -->
        <div id="view-feed" class="view">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold">Public Area</h2>
                <button onclick="app.refreshFeed()" class="bg-blue-600 px-4 py-2 rounded"><i class="fas fa-sync"></i> Refresh</button>
            </div>
            <div id="public-feed-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Posts will be injected here -->
            </div>
        </div>

        <!-- View: Page Creation -->
        <div id="view-create" class="view hidden">
            <div class="max-w-md mx-auto bg-gray-800 p-6 rounded-xl shadow-2xl">
                <h2 class="text-xl mb-4">Generate New Page</h2>
                <input type="number" id="page-number-input" placeholder="Enter numbers (1-9 allowed)" class="w-full bg-gray-700 p-3 rounded mb-4 outline-none focus:ring-2 focus:ring-blue-500">
                <input type="text" id="page-name-input" placeholder="Page Alias (Optional)" class="w-full bg-gray-700 p-3 rounded mb-4">
                <select id="page-privacy" class="w-full bg-gray-700 p-3 rounded mb-4">
                    <option value="public">Public</option>
                    <option value="private">Private</option>
                </select>
                <button onclick="app.createPage()" class="w-full bg-green-600 p-3 rounded font-bold">GENERATE & PROCEED</button>
            </div>
        </div>

        <!-- View: Dynamic Page -->
        <div id="view-page" class="view hidden">
            <div id="page-header" class="mb-6 border-b border-gray-700 pb-4">
                <h2 id="display-page-name" class="text-3xl font-bold"></h2>
                <p id="display-page-number" class="text-gray-400"></p>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- Left: Groups & Chat -->
                <div class="md:col-span-1 bg-gray-800 rounded p-4 h-[600px] flex flex-col">
                    <h3 class="font-bold mb-2">Groups</h3>
                    <div id="group-list" class="flex-grow overflow-y-auto mb-4 space-y-2"></div>
                    <button onclick="app.showGroupCreate()" class="bg-blue-500 w-full py-2 rounded text-sm">Create Group</button>
                    <hr class="my-4 border-gray-700">
                    <div id="chat-container" class="hidden flex flex-col flex-grow">
                        <div id="chat-messages" class="flex-grow overflow-y-auto bg-black rounded p-2 mb-2 text-sm"></div>
                        <div class="flex gap-1">
                            <input type="text" id="chat-input" class="flex-grow bg-gray-700 p-2 rounded text-sm" placeholder="Message...">
                            <button onclick="app.sendMessage()" class="bg-blue-600 px-3 rounded"><i class="fas fa-paper-plane"></i></button>
                        </div>
                    </div>
                </div>

                <!-- Right: Posts within Page -->
                <div class="md:col-span-2">
                    <div class="bg-gray-800 p-4 rounded mb-6">
                        <h3 class="font-bold mb-4">New Post</h3>
                        <input id="post-title" type="text" placeholder="Title" class="w-full bg-gray-700 p-2 mb-2 rounded">
                        <textarea id="post-desc" placeholder="Description" class="w-full bg-gray-700 p-2 mb-2 rounded"></textarea>
                        <div class="flex flex-wrap gap-2 mb-2">
                            <input type="file" id="post-video" accept="video/*" class="text-xs">
                            <input type="text" id="post-link" placeholder="External Link" class="bg-gray-700 p-1 text-xs rounded">
                        </div>
                        <button onclick="app.uploadPost()" id="btn-upload" class="bg-green-600 px-6 py-2 rounded font-bold">Post to Page</button>
                    </div>
                    <div id="page-posts" class="space-y-4"></div>
                </div>
            </div>
        </div>

        <!-- View: Profile -->
        <div id="view-profile" class="view hidden">
            <div class="max-w-md mx-auto bg-gray-800 p-6 rounded-xl">
                <h2 class="text-xl mb-6 font-bold">User Settings</h2>
                <div class="flex flex-col items-center mb-6">
                    <img id="profile-edit-pfp" src="" class="w-32 h-32 rounded-full mb-4 border-4 border-blue-500">
                    <input type="file" id="pfp-upload" class="text-sm mb-4">
                </div>
                <input type="text" id="profile-edit-name" class="w-full bg-gray-700 p-3 rounded mb-4" placeholder="Display Name">
                <button onclick="app.saveProfile()" class="w-full bg-blue-600 p-3 rounded font-bold">Save Changes</button>
            </div>
        </div>

    </main>

    <!-- Bottom Navigation -->
    <div class="fixed bottom-0 left-0 w-full bg-gray-900 border-t border-gray-800 p-3 flex justify-around items-center z-40">
        <button onclick="app.switchView('feed')" class="text-gray-400 hover:text-blue-400 flex flex-col items-center">
            <i class="fas fa-home text-xl"></i><span class="text-[10px]">Feed</span>
        </button>
        <button onclick="app.switchView('create')" class="bg-blue-600 w-12 h-12 rounded-full flex items-center justify-center -mt-8 shadow-lg border-4 border-gray-900">
            <i class="fas fa-plus text-white"></i>
        </button>
        <button onclick="app.switchView('profile')" class="text-gray-400 hover:text-blue-400 flex flex-col items-center">
            <i class="fas fa-user text-xl"></i><span class="text-[10px]">Profile</span>
        </button>
    </div>

    <script src="app.js"></script>
</body>
</html>
